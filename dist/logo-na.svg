<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;display=swap');
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#DCBA6E"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A68730"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F0EBE1"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="4 6"/>

  <!-- Top ornament -->
  <text x="200" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C9A84C" letter-spacing="8">✦ ✦ ✦</text>

  <!-- N -->
  <text x="98" y="238"
        text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="148"
        font-weight="300"
        fill="url(#goldGrad)"
        letter-spacing="-2">N</text>

  <!-- Heart -->
  <g transform="translate(200, 185)">
    <path d="M0,10 C0,10 -22,-8 -22,-22 C-22,-34 -12,-40 0,-30 C12,-40 22,-34 22,-22 C22,-8 0,10 0,10 Z"
          fill="#B87068"/>
    <!-- Highlight -->
    <ellipse cx="-10" cy="-26" rx="4" ry="6" fill="rgba(255,255,255,0.25)" transform="rotate(-20,-10,-26)"/>
  </g>

  <!-- A -->
  <text x="302" y="238"
        text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="148"
        font-weight="300"
        fill="url(#goldGrad)"
        letter-spacing="-2">A</text>

  <!-- Date -->
  <text x="200" y="298"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="13"
        font-weight="400"
        fill="#8B7D6E"
        letter-spacing="5">23 · 05 · 2026</text>

  <!-- Bottom ornament -->
  <text x="200" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#C9A84C" letter-spacing="6">✦ ✦ ✦</text>

  <!-- Bottom text arc simulation (straight) -->
  <text x="200" y="362"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="11"
        font-weight="400"
        fill="#B5A898"
        letter-spacing="3.5">NIKLAS &amp; ALEXANDER</text>
</svg>
