<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Logo Export</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    body { margin: 0; background: #888; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; font-family: sans-serif; }
    canvas { border-radius: 50%; box-shadow: 0 8px 40px rgba(0,0,0,0.3); }
    button { background: #2C2418; color: #FAF7F2; border: none; padding: 14px 32px; font-size: 16px; cursor: pointer; border-radius: 4px; letter-spacing: 2px; }
    button:hover { background: #B87068; }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="800"></canvas>
  <button onclick="download()">Als JPG speichern</button>

<script>
const canvas = document.getElementById('c')
const ctx    = canvas.getContext('2d')
const W = 800, H = 800, cx = W/2, cy = H/2

function draw() {
  ctx.clearRect(0, 0, W, H)

  // Background
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W/2)
  bg.addColorStop(0, '#FAF7F2')
  bg.addColorStop(1, '#F0EBE1')
  ctx.beginPath()
  ctx.arc(cx, cy, W/2 - 2, 0, Math.PI*2)
  ctx.fillStyle = bg
  ctx.fill()

  // Outer ring
  ctx.beginPath()
  ctx.arc(cx, cy, W/2 - 6, 0, Math.PI*2)
  ctx.strokeStyle = '#C9A84C'
  ctx.lineWidth = 3
  ctx.stroke()

  // Inner dashed ring
  ctx.beginPath()
  ctx.arc(cx, cy, W/2 - 32, 0, Math.PI*2)
  ctx.strokeStyle = '#C9A84C'
  ctx.lineWidth = 1.5
  ctx.setLineDash([8, 12])
  ctx.stroke()
  ctx.setLineDash([])

  // Gold gradient for text
  const gold = ctx.createLinearGradient(0, 0, W, H)
  gold.addColorStop(0,   '#DCBA6E')
  gold.addColorStop(0.5, '#C9A84C')
  gold.addColorStop(1,   '#A68730')

  // Top name
  ctx.font = '300 22px "Cormorant Garamond", Georgia, serif'
  ctx.fillStyle = '#B5A898'
  ctx.textAlign = 'center'
  ctx.letterSpacing = '8px'
  ctx.fillText('N I K L A S', cx, 175)

  // Top thin rule
  ctx.beginPath()
  ctx.moveTo(cx - 110, 195); ctx.lineTo(cx + 110, 195)
  ctx.strokeStyle = '#C9A84C'; ctx.lineWidth = 1; ctx.stroke()

  // N  — left
  ctx.font = '300 260px "Cormorant Garamond", Georgia, serif'
  ctx.fillStyle = gold
  ctx.textAlign = 'center'
  ctx.letterSpacing = '0px'
  ctx.fillText('N', 188, 490)

  // A  — right
  ctx.fillText('A', 612, 490)

  // Heart — center, big & prominent
  drawHeart(cx, 400, 70)

  // Bottom thin rule
  ctx.beginPath()
  ctx.moveTo(cx - 110, 530); ctx.lineTo(cx + 110, 530)
  ctx.strokeStyle = '#C9A84C'; ctx.lineWidth = 1; ctx.stroke()

  // Bottom name
  ctx.font = '300 22px "Cormorant Garamond", Georgia, serif'
  ctx.fillStyle = '#B5A898'
  ctx.textAlign = 'center'
  ctx.letterSpacing = '8px'
  ctx.fillText('A L E X A N D E R', cx, 558)

  // Date
  ctx.font = '400 20px Georgia, serif'
  ctx.fillStyle = '#C9A84C'
  ctx.letterSpacing = '4px'
  ctx.fillText('23 · 05 · 2026', cx, 630)

  // Bottom ornament
  ctx.font = '18px Georgia, serif'
  ctx.fillStyle = '#C9A84C'
  ctx.letterSpacing = '10px'
  ctx.fillText('✦ ✦ ✦', cx, 688)
}

function drawHeart(x, y, size) {
  ctx.save()
  ctx.translate(x, y)
  ctx.beginPath()
  ctx.moveTo(0, size * 0.3)
  ctx.bezierCurveTo( size*0.9,  -size*0.1,  size*1.1, -size*0.9,  0, -size*0.6)
  ctx.bezierCurveTo(-size*1.1,  -size*0.9, -size*0.9, -size*0.1,  0,  size*0.3)
  ctx.fillStyle = '#B87068'
  ctx.fill()
  // Highlight
  ctx.beginPath()
  ctx.ellipse(-size*0.25, -size*0.5, size*0.12, size*0.2, -0.4, 0, Math.PI*2)
  ctx.fillStyle = 'rgba(255,255,255,0.22)'
  ctx.fill()
  ctx.restore()
}

// Wait for font to load then draw
document.fonts.ready.then(() => { draw() })

function download() {
  draw()
  const a = document.createElement('a')
  a.download = 'logo-niklas-alexander.jpg'
  a.href = canvas.toDataURL('image/jpeg', 0.95)
  a.click()
}
</script>
</body>
</html>
